name: Build apps

# 手动触发，或打 tag（v1.0.0 之类）时自动构建并发布 Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write          # 发布 Release 需要

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: YouTubeEmailScraper-windows
          - os: macos-latest
            artifact: YouTubeEmailScraper-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # setup-python 在 macOS 上提供 universal2 + Tk 8.6 的 Python，
      # 产物在 Intel 和 Apple 芯片上都能跑（不依赖系统的坏 Tk 8.5）。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build (PyInstaller)
        run: pyinstaller --noconfirm youtube_email_gui.spec

      - name: Package macOS .dmg (with helper extras)
        if: runner.os == 'macOS'
        run: |
          STAGE=$(mktemp -d)
          cp -R "dist/YouTube邮箱采集器.app" "$STAGE/"
          cp dist-extras/*.command "$STAGE/" 2>/dev/null || true
          cp dist-extras/*.txt "$STAGE/" 2>/dev/null || true
          chmod +x "$STAGE/"*.command 2>/dev/null || true
          ln -s /Applications "$STAGE/应用程序"
          hdiutil create -volname "YouTube邮箱采集器" \
            -srcfolder "$STAGE" -ov -format UDZO "dist/YouTube邮箱采集器.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  # 打 tag 时，把两个平台的产物收集起来发布到 Releases
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
          generate_release_notes: true
