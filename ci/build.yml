name: Build apps

# 手动触发，或打 tag（v1.0.0 之类）时自动构建
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: YouTubeEmailScraper-windows
          - os: macos-latest
            artifact: YouTubeEmailScraper-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build (PyInstaller)
        run: pyinstaller --noconfirm youtube_email_gui.spec

      - name: Package macOS .dmg
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "YouTube邮箱采集器" \
            -srcfolder "dist/YouTube邮箱采集器.app" \
            -ov -format UDZO "dist/YouTube邮箱采集器.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
